version = 1

[providers.deepseek]
upstream = "https://api.deepseek.com"
secret = "op://AI Agents/DeepSeek/api-key"
allowed_paths = ["/v1/chat/completions", "/chat/completions"]
allowed_models = ["deepseek-chat", "deepseek-reasoner"]

[profiles.deepseek]
provider = "deepseek"
base_url_env = "OPENAI_BASE_URL"
api_key_env = "OPENAI_API_KEY"

[providers.glm]
upstream = "https://api.z.ai/api/paas/v4"
secret = "op://AI Agents/GLM/api-key"
allowed_paths = ["/chat/completions"]
allowed_models = ["glm-5.3-flash"]

[profiles.glm]
provider = "glm"
base_url_env = "OPENAI_BASE_URL"
api_key_env = "OPENAI_API_KEY"

[providers.muse]
upstream = "https://api.meta.ai/v1"
secret = "op://AI Agents/Muse/api-key"
allowed_paths = ["/chat/completions"]
allowed_models = ["muse-spark-1.3-contributor"]

[profiles.muse]
provider = "muse"
base_url_env = "OPENAI_BASE_URL"
api_key_env = "OPENAI_API_KEY"
