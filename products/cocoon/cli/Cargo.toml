[package]
name = "cocoon"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "A local credential firewall for AI agents"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
toml = "0.9"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
