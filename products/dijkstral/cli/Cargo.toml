[workspace]
resolver = "2"
# Crates are added when their stage begins (see ../DIJKSTRAL_DESIGN.md): semantic.
members = ["crates/core", "crates/serve", "crates/agents", "crates/export", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dijkstral-core = { path = "crates/core" }
dijkstral-serve = { path = "crates/serve" }
dijkstral-agents = { path = "crates/agents" }
dijkstral-export = { path = "crates/export" }
anyhow = "1"
blake3 = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
# Microsoft's MIT-licensed Leiden (graspologic-native v1.3.1, the engine Graphify calls through
# Python), so partitions match Graphify's for identical input and seed.
network_partitions = { git = "https://github.com/microsoft/graspologic-native", rev = "773181488b4e5b81925e302b972b294fd51f61a4" }
# The RNG network_partitions is driven by; the version graspologic-native 1.3.1 locks.
rand = "=0.10.1"
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
sha1_smol = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-php = "0.24"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
