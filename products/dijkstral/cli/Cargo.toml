[workspace]
resolver = "2"
# Crates are added when their stage begins (see ../DIJKSTRAL_DESIGN.md): serve, export, semantic.
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dijkstral-core = { path = "crates/core" }
anyhow = "1"
blake3 = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
sha1_smol = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
