plugins {
    id 'groovy'
    id 'application'
}

group = 'com.shop'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.21'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
}

application {
    mainClass = 'com.shop.App'
}

class VersionTask extends DefaultTask {
    void printVersion() {
        println project.version
        describe()
    }

    String describe() {
        "shop ${project.version}"
    }
}

task hello {
    doLast { println 'hello' }
}
