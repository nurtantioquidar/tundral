[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/atlas"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "signal",
  "fs",
  "io-util",
  "time",
  "sync",
] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "events"] }
nucleo-matcher = "0.3"
unicode-width = "0.2"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
blake3 = "1"

[profile.release]
lto = "thin"
strip = true
