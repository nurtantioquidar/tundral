[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "signal",
  "fs",
  "io-util",
  "time",
  "sync",
] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "15"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
