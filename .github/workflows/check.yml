# The root check on every push and pull request: the same `bun run check` contributors run
# locally (AGENTS.md, "Workspace commands"). It is offline and never uses a paid upstream.
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Three Rust workspaces' test binaries outgrow the runner's disk with debug info (the linker
    # dies with a bus error): build without it, and without incremental state, which CI never reuses.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup && df -h /

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            products/butterfly/cli
            products/dijkstral/cli
            products/dijkstral/service

      - run: bun install --frozen-lockfile

      - run: bun run check
