# Hosted Dijkstral's service image (products/dijkstral/service/Dockerfile), built on main and
# pushed to the repository's private GHCR package. Charon pulls it by digest
# (DIJKSTRAL_HOSTED_DESIGN.md §4), so a push here deploys nothing by itself.
name: dijkstral-service-image

on:
  push:
    branches: [main]
    paths:
      - products/dijkstral/cli/Cargo.toml
      - products/dijkstral/cli/crates/**
      - products/dijkstral/service/**
      - products/dijkstral/.dockerignore
      - .github/workflows/dijkstral-service-image.yml
  workflow_dispatch:

concurrency:
  group: dijkstral-service-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: products/dijkstral
          file: products/dijkstral/service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dijkstral-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dijkstral-service:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest to pin on charon
        run: echo "ghcr.io/${{ github.repository_owner }}/dijkstral-service@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
